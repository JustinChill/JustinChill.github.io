  <style>
    .foods {
      display: grid;
      justify-items: center;
      gap: 1.5rem;
      margin: 0;
    }

    .food {
      --shadow: #ccc;
      position: relative;
      display: grid;
      justify-items: center;
      gap: 1.25rem;
      padding: 25px;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    html[data-theme="dark"] .food {
      --shadow: #333;
    }

    /* Covers its own tile, so focus never scrolls the page */
    .food input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .food:has(:focus-visible) {
      outline: 2px solid var(--link-color);
      outline-offset: 4px;
    }

    .food img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .words {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .1em .25em;
      color: var(--text-color);
      font: 2.4rem/1.1 "Camphor Heavy", var(--font-main);
      text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--shadow);
    }

    .words span {
      font-size: inherit;
    }

    @media (prefers-reduced-motion: no-preference) {

      .food:hover img,
      .food :focus-visible~img,
      .food :checked~img {
        animation: spin 4s linear infinite;
      }

      .food:hover .words span,
      .food :focus-visible~.words span,
      .food :checked~.words span {
        animation: pop 1s calc(var(--i) * .5s) forwards;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .food:hover .words,
      .food :focus-visible~.words,
      .food :checked~.words {
        text-shadow: 4px 4px 0 orange;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes pop {
      to {
        text-shadow: 4px 4px 0 yellow, 8px 8px 0 orange, 12px 12px 0 red, 16px 16px 0 brown;
      }
    }

    @media (max-width: 620px) {
      .words {
        font-size: 2rem;
      }
    }
  </style>

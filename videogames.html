  <script src="https://cdn.jsdelivr.net/npm/d3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot"></script>

  <script type="text/javascript">
    // Define all generations and their timeline year spans
    const genDefinitions = [
      { gen: "1st", startYear: 1972, endYear: 1977, bubbleTotal: 4.5, labelAbove: true },
      { gen: "2nd", startYear: 1978, endYear: 1982, bubbleTotal: 40 },
      { gen: "3rd", startYear: 1983, endYear: 1986, bubbleTotal: 88 },
      { gen: "4th", startYear: 1987, endYear: 1992, bubbleTotal: 90 },
      { gen: "5th", startYear: 1993, endYear: 1997, bubbleTotal: 148 },
      { gen: "6th", startYear: 1998, endYear: 2004, bubbleTotal: 212 },
      { gen: "7th", startYear: 2005, endYear: 2011, bubbleTotal: 254 },
      { gen: "8th", startYear: 2012, endYear: 2012, bubbleTotal: null }
    ];

    // Colors per generation to match The Economist palette
    const genColors = {
      "1st": "#76A36A", // Green
      "2nd": "#BA9C43", // Ochre/Tan
      "3rd": "#4898B8", // Slate Blue
      "4th": "#9C74A6", // Purple
      "5th": "#3CB6A6", // Teal
      "6th": "#6F8295", // Grey-Blue
      "7th": "#E47954", // Orange
      "8th": "#E77AC6"  // Magenta/Pink
    };

    const bgColors = {
      "1st": "#EDF5EB",
      "2nd": "#F7F4EB",
      "3rd": "#EBF4FA",
      "4th": "#F6EFF7",
      "5th": "#ECF8F7",
      "6th": "#F1F3F5",
      "7th": "#FDF2EC",
      "8th": "#FDEDFA"
    };

    // Load console data and construct chronological timeline
    d3.csv("data/consoles.csv", d3.autoType).then(function (rawConsoles) {
      const consolesByYear = d3.group(rawConsoles, d => `${d.Generation}-${d.Launch}`);

      const allRows = [];
      let rowCounter = 0;

      genDefinitions.forEach(g => {
        for (let y = g.startYear; y <= g.endYear; y++) {
          const key = `${g.gen}-${y}`;
          const consoles = consolesByYear.get(key);

          if (consoles && consoles.length > 0) {
            consoles.forEach((c, idx) => {
              allRows.push({
                rowId: `row-${rowCounter++}`,
                gen: g.gen,
                year: y,
                isYearTick: idx === 0,
                yearLabel: (y === 1972 || y === 2000) ? `${y}` : `${String(y).slice(2).padStart(2, '0')}`,
                console: c.Console,
                units: c.Units,
                isMulti: consoles.length > 1
              });
            });
          } else {
            // Gap year with no major console launch
            allRows.push({
              rowId: `row-${rowCounter++}`,
              gen: g.gen,
              year: y,
              isYearTick: true,
              yearLabel: (y === 1972 || y === 2000) ? `${y}` : `${String(y).slice(2).padStart(2, '0')}`,
              console: null,
              units: null,
              isMulti: false
            });
          }
        }
      });

      const consoleRows = allRows.filter(d => d.console !== null);
      const yearTickRows = allRows.filter(d => d.isYearTick);

      // Compute generation middle rows for labels and summary bubbles
      const genSummaries = genDefinitions.map(g => {
        const rowsInGen = allRows.filter(d => d.gen === g.gen);
        const midRow = rowsInGen[Math.floor(rowsInGen.length / 2)];
        return {
          gen: g.gen,
          midRowId: midRow ? midRow.rowId : null,
          bubbleTotal: g.bubbleTotal,
          labelAbove: g.labelAbove || false
        };
      });

      const bubbleRows = genSummaries.filter(d => d.bubbleTotal !== null);

      function renderChart() {
        const container = document.getElementById("consoles");
        container.innerHTML = "";
        const width = Math.max(680, container.getBoundingClientRect().width || 720);

        const marginLeft = 270;
        const marginRight = 110;
        const chartInnerWidth = width - marginLeft - marginRight;
        const pxPerUnit = chartInnerWidth / 160;

        // Conversion helper from pixel offset (relative to timeline x=0) to data space x:
        const xAtPx = (px) => px / pxPerUnit;

        const xLeftEdge = xAtPx(-marginLeft);              // Left edge of SVG (pixel 0)
        const xGenBarEnd = xAtPx(-marginLeft + 28);        // Right edge of solid generation bar (pixel 28)
        const xGenText = xAtPx(-marginLeft + 14);          // Center of solid generation bar (pixel 14)
        const xConsole = xAtPx(-24);                       // Console names (24px left of timeline)
        const xYearTick = xAtPx(-5);                       // Year labels (5px left of timeline)
        const xRightEdge = 160 + xAtPx(marginRight);       // Right edge of SVG (pixel width)
        const xBubble = 160 + xAtPx(marginRight / 2);      // Center of right summary bubbles

        const options = {
          width: width,
          height: allRows.length * 23 + 70,
          marginLeft: marginLeft,
          marginRight: marginRight,
          marginTop: 45,
          marginBottom: 15,
          x: {
            axis: "top",
            domain: [0, 160],
            ticks: [0, 20, 40, 60, 80, 100, 120, 140, 160],
            grid: true,
            label: null
          },
          y: {
            axis: null,
            domain: allRows.map(d => d.rowId)
          },
          r: {
            type: "sqrt",
            domain: [0, 260],
            range: [0, 36]
          },
          style: {
            fontFamily: "Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
            fontSize: 11,
            overflow: "visible",
            backgroundColor: "transparent"
          },
          marks: [
            // 1. Full-width background pastel tint per generation
            Plot.barX(allRows, {
              y: "rowId",
              x1: xLeftEdge,
              x2: xRightEdge,
              fill: d => bgColors[d.gen],
              insetTop: 0,
              insetBottom: 0,
              clip: false
            }),

            // 2. Far-left solid generation block
            Plot.barX(allRows, {
              y: "rowId",
              x1: xLeftEdge,
              x2: xGenBarEnd,
              fill: d => genColors[d.gen],
              insetTop: 0,
              insetBottom: 0,
              clip: false
            }),

            // 3. Rotated generation name in solid block
            Plot.text(genSummaries, {
              y: "midRowId",
              x: xGenText,
              text: "gen",
              rotate: -90,
              fill: "#ffffff",
              fontWeight: "bold",
              fontSize: 12.5,
              textAnchor: "middle",
              clip: false
            }),

            // 4. Console Names (left of timeline)
            Plot.text(consoleRows, {
              y: "rowId",
              x: xConsole,
              text: "console",
              textAnchor: "end",
              fill: "#222222",
              fontSize: 11,
              fontWeight: "500",
              clip: false
            }),

            // 5. Year labels along timeline
            Plot.text(yearTickRows, {
              y: "rowId",
              x: xYearTick,
              text: "yearLabel",
              textAnchor: "end",
              fill: d => d.console ? "#333333" : "#777777",
              fontStyle: "italic",
              fontSize: 10,
              clip: false
            }),

            // 6. Vertical timeline rule and ticks at x = 0
            Plot.ruleX([0], {
              stroke: "#666666",
              strokeWidth: 1.2
            }),
            Plot.link(yearTickRows, {
              y1: "rowId",
              y2: "rowId",
              x1: xAtPx(-3),
              x2: 0,
              stroke: "#888888",
              strokeWidth: 0.8,
              clip: false
            }),

            // 7. Column Headers at Top
            Plot.text(["Generation"], {
              y: allRows[0].rowId,
              x: xGenText,
              dy: -24,
              textAnchor: "middle",
              fill: "#222222",
              fontWeight: "bold",
              fontSize: 11,
              clip: false
            }),
            Plot.text(["(Launch)"], {
              y: allRows[0].rowId,
              x: xYearTick,
              dy: -24,
              textAnchor: "end",
              fill: "#666666",
              fontStyle: "italic",
              fontSize: 10,
              clip: false
            }),
            Plot.text(["Total units\nsold, m"], {
              y: allRows[0].rowId,
              x: xBubble,
              dy: -24,
              textAnchor: "middle",
              fill: "#222222",
              fontWeight: "bold",
              fontSize: 10.5,
              lineHeight: 1.15,
              clip: false
            }),

            // 8. Horizontal Sales Bars
            Plot.barX(consoleRows, {
              y: "rowId",
              x: "units",
              fill: d => genColors[d.gen],
              insetTop: 3.5,
              insetBottom: 3.5,
              tip: true,
              title: d => `${d.console} (${d.year})\n${d.units}m lifetime units`
            }),

            // 9. Total Units Sold Summary Bubbles (Right Margin)
            Plot.dot(bubbleRows, {
              y: "midRowId",
              x: xBubble,
              r: "bubbleTotal",
              fill: d => genColors[d.gen],
              stroke: "#ffffff",
              strokeWidth: 1,
              clip: false,
              tip: true,
              title: d => `${d.gen} Generation Total: ${d.bubbleTotal}m units`
            }),

            // Bubble text centered inside (2nd-7th generation)
            Plot.text(bubbleRows.filter(d => !d.labelAbove), {
              y: "midRowId",
              x: xBubble,
              text: d => `${d.bubbleTotal}`,
              fill: "#ffffff",
              fontWeight: "bold",
              fontSize: 12,
              textAnchor: "middle",
              clip: false
            }),

            // Bubble text above small dot (1st generation: 4.5)
            Plot.text(bubbleRows.filter(d => d.labelAbove), {
              y: "midRowId",
              x: xBubble,
              dy: -12,
              text: d => `${d.bubbleTotal}`,
              fill: "#333333",
              fontWeight: "bold",
              fontSize: 11,
              textAnchor: "middle",
              clip: false
            })
          ]
        };

        container.appendChild(Plot.plot(options));
      }

      renderChart();

      // Handle responsive resize with simple debounce
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderChart, 150);
      });
    });
  </script>
  <script>
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeToggleLightIcon = document.getElementById("theme-toggle-light-icon");
    const themeToggleDarkIcon = document.getElementById("theme-toggle-dark-icon");

    function updateIcons(theme) {
      if (theme === "dark") {
        themeToggleLightIcon.classList.remove("hidden");
        themeToggleDarkIcon.classList.add("hidden");
      } else {
        themeToggleLightIcon.classList.add("hidden");
        themeToggleDarkIcon.classList.remove("hidden");
      }
    }

    const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
    updateIcons(currentTheme);

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const activeTheme = document.documentElement.getAttribute("data-theme") || "light";
        const newTheme = activeTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateIcons(newTheme);
      });
    }
  </script>

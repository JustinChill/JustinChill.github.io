<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="auto" role="img" aria-label="Comparison between Offset-based row scanning and Cursor-based index seeking in databases">
  <defs>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e05656"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background container -->
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header Title -->
  <text x="24" y="32" class="title" fill="#0f172a" font-size="16">Database Execution: Offset Scan vs. Cursor Seek</text>
  <text x="24" y="52" class="subtitle" fill="#64748b">How database engines physically retrieve page records on large datasets (1M+ rows)</text>

  <!-- Left Card: Offset Pagination -->
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="324" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="324" height="36" rx="8" fill="#fff1f2"/>
    <text x="14" y="23" class="title" fill="#be123c">Offset-based (LIMIT 10 OFFSET 10000)</text>

    <!-- Query snippet -->
    <rect x="14" y="46" width="296" height="26" rx="4" fill="#f1f5f9"/>
    <text x="22" y="63" class="code" fill="#334155">SELECT * FROM items OFFSET 10000 LIMIT 10;</text>

    <!-- Database Scan Visual -->
    <text x="14" y="94" class="subtitle" fill="#475569" font-weight="600">Scan Path:</text>
    
    <!-- Discarded rows bar -->
    <rect x="14" y="104" width="220" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3 3"/>
    <text x="124" y="121" class="subtitle" fill="#dc2626" text-anchor="middle" font-size="11">Scans &amp; discards 10,000 rows</text>
    
    <!-- Returned rows bar -->
    <rect x="238" y="104" width="72" height="26" rx="4" fill="#fed7aa" stroke="#fb923c"/>
    <text x="274" y="121" class="subtitle" fill="#c2410c" text-anchor="middle" font-size="11">10 Rows</text>

    <!-- Pointer arrow -->
    <path d="M 14 140 L 234 140" stroke="#e05656" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="124" y="156" class="subtitle" fill="#991b1b" text-anchor="middle" font-size="10">Linear $O(N)$ row traversal</text>

    <!-- Badge verdict -->
    <rect x="14" y="172" width="296" height="26" rx="4" fill="#fef2f2"/>
    <text x="24" y="189" class="badge" fill="#b91c1c">⚠️ Performance degrades with page depth</text>
  </g>

  <!-- Right Card: Cursor Pagination -->
  <g transform="translate(372, 70)">
    <rect x="0" y="0" width="324" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="324" height="36" rx="8" fill="#ecfdf5"/>
    <text x="14" y="23" class="title" fill="#047857">Cursor-based (WHERE id &gt; cursor LIMIT 10)</text>

    <!-- Query snippet -->
    <rect x="14" y="46" width="296" height="26" rx="4" fill="#f1f5f9"/>
    <text x="22" y="63" class="code" fill="#334155">SELECT * FROM items WHERE id &gt; 10000 LIMIT 10;</text>

    <!-- Database Scan Visual -->
    <text x="14" y="94" class="subtitle" fill="#475569" font-weight="600">Scan Path:</text>

    <!-- B-Tree Index Jump -->
    <rect x="14" y="104" width="220" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="124" y="121" class="subtitle" fill="#94a3b8" text-anchor="middle" font-size="11">B-Tree Index direct leap (0 scanned)</text>
    
    <!-- Returned rows bar -->
    <rect x="238" y="104" width="72" height="26" rx="4" fill="#bbf7d0" stroke="#4ade80"/>
    <text x="274" y="121" class="subtitle" fill="#15803d" text-anchor="middle" font-size="11">10 Rows</text>

    <!-- Direct leap arrow -->
    <path d="M 14 140 Q 126 130 234 140" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="124" y="156" class="subtitle" fill="#065f46" text-anchor="middle" font-size="10">Constant $O(1)$ / $O(\log N)$ Index Seek</text>

    <!-- Badge verdict -->
    <rect x="14" y="172" width="296" height="26" rx="4" fill="#f0fdf4"/>
    <text x="24" y="189" class="badge" fill="#15803d">✓ Constant ~1ms speed at any page depth</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 44" width="340" height="44" role="img" aria-label="Bootstrap pagination interface showing page numbers 1 through 5, with Previous and Next buttons">
  <defs>
    <filter id="shadow" x="-2%" y="-5%" width="104%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.06"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central">
    <!-- Container background & outer border -->
    <rect x="1" y="1" width="338" height="42" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
    
    <!-- Vertical Dividers -->
    <line x1="82" y1="1" x2="82" y2="43" stroke="#dee2e6" stroke-width="1"/>
    <line x1="122" y1="1" x2="122" y2="43" stroke="#dee2e6" stroke-width="1"/>
    <line x1="162" y1="1" x2="162" y2="43" stroke="#dee2e6" stroke-width="1"/>
    <line x1="202" y1="1" x2="202" y2="43" stroke="#dee2e6" stroke-width="1"/>
    <line x1="242" y1="1" x2="242" y2="43" stroke="#dee2e6" stroke-width="1"/>
    <line x1="282" y1="1" x2="282" y2="43" stroke="#dee2e6" stroke-width="1"/>

    <!-- Active Page Highlight (Page 1) -->
    <rect x="82" y="1" width="40" height="42" fill="#0d6efd"/>

    <!-- Labels & Numbers -->
    <text x="41" y="22" fill="#0d6efd">Previous</text>
    <text x="102" y="22" fill="#ffffff" font-weight="600">1</text>
    <text x="142" y="22" fill="#0d6efd">2</text>
    <text x="182" y="22" fill="#0d6efd">3</text>
    <text x="222" y="22" fill="#0d6efd">4</text>
    <text x="262" y="22" fill="#0d6efd">5</text>
    <text x="311" y="22" fill="#0d6efd">Next</text>
  </g>
</svg>

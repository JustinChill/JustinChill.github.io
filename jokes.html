			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', theme);
			document.documentElement.classList.remove('no-js');
			document.documentElement.classList.add('js');
		})();
	</script>

	<style type="text/css">
		:root {
			--joke-bg: #f7f5fc;
			--joke-card-border: transparent;
			--joke-card-shadow: 0px 18px 24px -15px rgba(89, 31, 249, 0.25), 0px 15px 20px -25px rgba(89, 31, 249, 0.25);
			--joke-avatar-bg: #ffffff;
			--joke-avatar-shadow: 0px 11px 10px -10px rgba(89, 31, 249, 0.65);
			--joke-actions-bg: #ffffff;
			--joke-actions-shadow: 0px 11px 10px -10px rgba(89, 31, 249, 0.15);
			--joke-text-color: #202020;
			--joke-info-color: rgba(32, 32, 32, 0.65);
			--joke-dot-color: #591ff9;
			--joke-border-hover: rgba(89, 31, 249, 0.25);
			--joke-action-hover-bg: #f7f5fc;
		}

		[data-theme="dark"] {
			--joke-bg: #1e1b2e;
			--joke-card-border: rgba(139, 92, 246, 0.25);
			--joke-card-shadow: 0px 18px 30px -10px rgba(0, 0, 0, 0.6), 0px 0px 20px 0px rgba(139, 92, 246, 0.15);
			--joke-avatar-bg: #27233d;
			--joke-avatar-shadow: 0px 8px 16px -4px rgba(0, 0, 0, 0.5), 0px 0px 12px rgba(139, 92, 246, 0.4);
			--joke-actions-bg: #27233d;
			--joke-actions-shadow: 0px 8px 16px -4px rgba(0, 0, 0, 0.5);
			--joke-text-color: #f1f1f6;
			--joke-info-color: rgba(241, 241, 246, 0.7);
			--joke-dot-color: #a78bfa;
			--joke-border-hover: rgba(167, 139, 250, 0.4);
			--joke-action-hover-bg: #342e50;
		}

		html {
			box-sizing: border-box;
			height: 100%;
			font-size: 100%;
			-webkit-text-size-adjust: 100%;
			-ms-text-size-adjust: 100%;
		}

		* {
			-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
		}

		body {
			font-family: "Roboto", "Helvetica Neue", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
			min-height: 80vh;
			overscroll-behavior: none;
		}

		/* Navigation Touch Targets */
		.nav__item,
		#theme-toggle {
			min-height: 44px;
			min-width: 44px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		img {
			width: 100%;
			font-style: italic;
			vertical-align: middle;
		}

		img[height],
		img[width] {
			width: auto;
		}

		a:focus-visible,
		button:focus-visible {
			outline: 2px solid var(--joke-dot-color);
			outline-offset: 2px;
		}

		.emoji {
			display: inline-block;
			white-space: nowrap;
			font-size: 2.074rem;
			user-select: none;
		}

		.emoji--small {
			font-size: 1.44rem;
		}

		.project-container {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 2.25rem 1.25rem 1.25rem;
			width: 100%;
			height: 100%;
			max-width: 768px;
			margin: 0 auto;
		}

		.avatar {
			align-self: flex-start;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: var(--joke-avatar-bg);
			height: 58px;
			width: 58px;
			flex-shrink: 0;
			border-radius: 90px;
			user-select: none;
			box-shadow: var(--joke-avatar-shadow);
			transition: background-color 200ms ease, box-shadow 200ms ease;
		}

		.avatar .emoji {
			position: relative;
			top: 2px;
		}

		/* Pure CSS Avatar Animation */
		@keyframes avatarBounce {
			0% {
				transform: scale(1);
			}
			35% {
				transform: scale(1.35);
			}
			65% {
				transform: scale(0.92);
			}
			85% {
				transform: scale(1.06);
			}
			100% {
				transform: scale(1);
			}
		}

		.avatar.is-animating {
			animation: avatarBounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
		}

		.chat-bot {
			position: relative;
			display: flex;
			flex-direction: column;
			width: 100%;
		}

		@media (min-width: 768px) {
			.chat-bot {
				flex-direction: row;
			}
		}

		.chat-bot__chatter {
			position: relative;
			display: flex;
			align-items: center;
			order: 1;
		}

		@media (min-width: 768px) {
			.chat-bot__chatter {
				order: 0;
				align-self: flex-end;
			}
		}

		.chat-bot__messages {
			position: relative;
			width: 100%;
			margin-left: 0;
		}

		@media (min-width: 768px) {
			.chat-bot__messages {
				margin-left: 1.25rem;
			}
		}

		/* Pure CSS Message Pop-in Animation */
		@keyframes bubblePopIn {
			0% {
				opacity: 0;
				transform: translateY(16px) scale(0.97);
			}
			70% {
				opacity: 1;
				transform: translateY(-4px) scale(1.01);
			}
			100% {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		.chat-bot__messages.is-entering {
			animation: bubblePopIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
		}

		.chat-bot__messages-info {
			position: relative;
			margin-top: 0.75rem;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			color: var(--joke-info-color);
			padding: 0 0.25rem;
		}

		.chat-status-group {
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}

		.info-icon svg,
		.info-icon .feather {
			display: block;
			height: 18px;
			width: 18px;
			stroke: currentColor;
		}

		/* Mute / SFX Toggle Button positioned bottom-right */
		.sfx-toggle-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 36px;
			height: 36px;
			padding: 0;
			border-radius: 50%;
			border: 1px solid var(--joke-card-border);
			background-color: var(--joke-avatar-bg);
			color: var(--joke-info-color);
			cursor: pointer;
			box-shadow: var(--joke-actions-shadow);
			transition: all 175ms ease-out;
		}

		.sfx-toggle-btn:hover {
			transform: translateY(-1px) scale(1.06);
			background-color: var(--joke-action-hover-bg);
			color: var(--joke-text-color);
			border-color: var(--joke-border-hover);
		}

		.sfx-toggle-btn:active {
			transform: scale(0.94);
		}

		.sfx-toggle-btn.is-muted {
			opacity: 0.75;
		}

		.sfx-icon {
			display: block;
			width: 18px;
			height: 18px;
			stroke: currentColor;
			stroke-width: 2;
			fill: none;
		}

		/* Pure CSS Typing Indicator / Speaker Dots */
		.speaker {
			position: relative;
			opacity: 0;
			visibility: hidden;
			display: inline-flex;
			align-items: center;
			margin-left: 1.25rem;
			transform: translateY(16px);
			transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.25s ease;
		}

		.speaker.is-visible {
			opacity: 1;
			visibility: visible;
			transform: translateY(0);
		}

		.speaker__dot {
			display: inline-block;
			height: 12px;
			width: 12px;
			border-radius: 90px;
			margin: 0.5rem;
			background-color: var(--joke-dot-color);
		}

		.speaker.is-visible .speaker__dot {
			animation: dotWave 0.6s ease-in-out infinite alternate;
		}

		.speaker.is-visible .speaker__dot:nth-child(1) {
			animation-delay: 0s;
		}

		.speaker.is-visible .speaker__dot:nth-child(2) {
			animation-delay: 0.18s;
		}

		.speaker.is-visible .speaker__dot:nth-child(3) {
			animation-delay: 0.36s;
		}

		@keyframes dotWave {
			0% {
				transform: translateY(0);
			}
			100% {
				transform: translateY(8px);
			}
		}

		.chat-bubble {
			position: relative;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: var(--joke-bg);
			padding: 1.25rem;
			border-radius: 1.25rem;
			border-bottom-left-radius: 0;
			transition: background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
			border: 3px solid var(--joke-card-border);
			box-shadow: var(--joke-card-shadow);
		}

		@media (min-width: 768px) {
			.chat-bubble {
				padding: 2rem;
			}
		}

		.chat-bubble__actions {
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: space-evenly;
			padding: 0.25rem 0.4rem;
			top: -24px;
			right: 12px;
			width: 152px;
			height: 46px;
			background-color: var(--joke-actions-bg);
			border: 1px solid var(--joke-card-border);
			border-radius: 90px;
			box-shadow: var(--joke-actions-shadow);
			transition: opacity 200ms ease, transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1), visibility 200ms ease;
			z-index: 10;
			pointer-events: auto;
			touch-action: manipulation;
		}

		/* Invisible hover bridge so mouse never loses hover zone when moving between bubble and actions */
		.chat-bubble__actions::before {
			content: '';
			position: absolute;
			top: -6px;
			left: -10px;
			right: -10px;
			bottom: -18px;
			z-index: -1;
		}

		.chat-bubble__actions .emoji-action {
			cursor: pointer;
			border: none;
			user-select: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			background-color: transparent;
			text-align: center;
			height: 38px;
			width: 38px;
			min-height: 38px;
			min-width: 38px;
			border-radius: 50%;
			transition: all 175ms ease-out;
			transform: scale(1);
			touch-action: manipulation;
			-webkit-tap-highlight-color: transparent;
		}

		.chat-bubble__actions .emoji-action:hover,
		.chat-bubble__actions .emoji-action:focus {
			outline: none;
			transform: scale(1.22);
			background-color: var(--joke-action-hover-bg);
		}

		.chat-bubble__actions .emoji-action:active {
			transform: scale(0.92);
		}

		.chat-bubble:hover,
		.chat-bubble:focus {
			outline: none;
			border: 3px solid var(--joke-border-hover);
		}

		/* Desktop hover & keyboard focus */
		@media (hover: hover) and (pointer: fine) {
			.chat-bubble__actions {
				opacity: 0;
				visibility: hidden;
				transform: translateY(6px) scale(0.92);
			}

			.chat-bubble:hover .chat-bubble__actions,
			.chat-bubble:focus .chat-bubble__actions,
			.chat-bubble:focus-within .chat-bubble__actions,
			.chat-bubble__actions:hover {
				visibility: visible;
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		/* Touch devices / Mobile: always visible & tap-ready */
		@media (hover: none), (pointer: coarse) {
			.chat-bubble__actions {
				opacity: 1;
				visibility: visible;
				transform: translateY(0) scale(1);
			}
		}

		.time-received {
			display: block;
			font-size: 0.833rem;
			font-family: "Roboto Mono", monospace;
			font-weight: 500;
			color: var(--joke-info-color);
		}

		/* Joke text with modern, expressive display typography */
		.chat-message {
			margin: 0;
			line-height: 1.4;
			font-size: clamp(1.25rem, 3.2vw, 1.55rem);
			font-family: "Outfit", "Plus Jakarta Sans", "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			font-weight: 600;
			letter-spacing: -0.015em;
			margin-right: auto;
			white-space: pre-wrap;
			color: var(--joke-text-color);
			transition: opacity 0.2s ease;
		}

		.offline-tag {
			display: inline-block;
			font-size: 0.7rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			background: #ef4444;
			color: #ffffff;
			padding: 0.1rem 0.4rem;
			border-radius: 4px;
			margin-left: 0.5rem;
			vertical-align: middle;
		}

		/* Reduced Motion Preference */
		@media (prefers-reduced-motion: reduce) {
			*,
			::before,
			::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
				scroll-behavior: auto !important;
			}
		}
	</style>

			<li id="tribute">Inspired by <a href="https://codepen.io/alxvtoronto" target="_blank">Alex Vong</a> <a
					href="#tribute-ref" aria-label="Back to content">↩</a></li>
		</ol>
		<div>
			<p>Justin Chill &copy; 2026</p>
			<span><a href="https://github.com/JustinChill/JustinChill.github.io" target="_blank"><img
						src="imgs/github.svg" alt="GitHub logo" class="icon">Source code</a></span>
		</div>
	</footer>

	<script type="text/javascript">
		// Helper functions
		function $(element) {
			return document.querySelector(element);
		}

		function createNewElement(element, cssClass = null) {
			const newElement = document.createElement(element);
			if (cssClass) {
				newElement.className = cssClass;
			}
			return newElement;
		}

		const JOKES_API = "https://icanhazdadjoke.com/";
		const avatar = $(".avatar");
		const chatBot = $(".chat-bot");
		const speaker = $(".speaker");
		const actions = [
			{ emoji: "😂", label: "React with laughing face and get another joke" },
			{ emoji: "🤣", label: "React with rolling on the floor laughing and get another joke" },
			{ emoji: "😅", label: "React with sweat smile and get another joke" }
		];

		// Offline joke fallback pool
		const FALLBACK_JOKES = [
			"I'm reading a book on anti-gravity. It's impossible to put down!",
			"Why don't scientists trust atoms? Because they make up everything!",
			"Did you hear about the mathematician who's afraid of negative numbers? He'll stop at nothing to avoid them!",
			"Why do cows have hooves instead of feet? Because they lactose!",
			"What do you call a fake noodle? An impasta!",
			"Why did the scarecrow win an award? Because he was outstanding in his field!",
			"How does a penguin build its house? Igloos it together!",
			"What do you call a belt made out of watches? A waist of time!",
			"Why can't your nose be 12 inches long? Because then it would be a foot!",
			"What standard metric unit is used to measure dad jokes? A sigh-o-meter!",
			"What did one wall say to the other? I'll meet you at the corner!",
			"Why don't eggs tell jokes? They'd crack each other up!",
			"I used to play piano by ear, but now I use my hands.",
			"What do you call a sleeping bull? A bulldozer!",
			"Why did the bicycle fall over? Because it was two-tired!",
			"What's orange and sounds like a parrot? A carrot!",
			"What do you call cheese that isn't yours? Nacho cheese!",
			"How do you organize a space party? You planet!",
			"Why did the golf ball wear two pairs of pants? In case he got a hole in one!",
			"What do you call a fish with no eyes? A fsh!"
		];

		let lastJoke = "";
		let isFetching = false;

		// Audio SFX Manager
		let soundEnabled = localStorage.getItem("jokes_sfx") !== "false";

		// Speaker SVG Icons for Mute Toggle
		const SPEAKER_ON_SVG = `<svg class="sfx-icon sfx-icon--on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
		const SPEAKER_OFF_SVG = `<svg class="sfx-icon sfx-icon--off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;

		// Web Audio API Sound Synthesizer for UI Effects
		let audioCtx = null;

		function initAudio() {
			if (!audioCtx) {
				audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			}
			if (audioCtx && audioCtx.state === 'suspended') {
				audioCtx.resume();
			}
		}

		function playClickSFX() {
			if (!soundEnabled) return;
			try {
				initAudio();
				if (!audioCtx || audioCtx.state !== 'running') return;
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();

				osc.connect(gain);
				gain.connect(audioCtx.destination);

				osc.type = "sine";
				osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
				osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);

				gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

				osc.start();
				osc.stop(audioCtx.currentTime + 0.08);
			} catch (e) {
				// Silently handle browser autoplay policy
			}
		}

		function playPopSFX() {
			if (!soundEnabled) return;
			try {
				initAudio();
				if (!audioCtx || audioCtx.state !== 'running') return;
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();

				osc.connect(gain);
				gain.connect(audioCtx.destination);

				osc.type = "sine";
				osc.frequency.setValueAtTime(400, audioCtx.currentTime);
				osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);

				gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

				osc.start();
				osc.stop(audioCtx.currentTime + 0.15);
			} catch (e) {
				// Silently handle browser autoplay policy
			}
		}

		function playTypingSFX() {
			if (!soundEnabled) return;
			try {
				initAudio();
				if (!audioCtx || audioCtx.state !== 'running') return;
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();

				osc.connect(gain);
				gain.connect(audioCtx.destination);

				osc.type = "triangle";
				osc.frequency.setValueAtTime(150, audioCtx.currentTime);

				gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

				osc.start();
				osc.stop(audioCtx.currentTime + 0.05);
			} catch (e) {
				// Silently handle browser autoplay policy
			}
		}

		// Create dynamic DOM elements
		const chatContainer = createNewElement("div", "chat-bot__messages");
		const chatBubble = createNewElement("div", "chat-bubble");
		const messagesInfo = createNewElement("div", "chat-bot__messages-info");
		const statusGroup = createNewElement("div", "chat-status-group");
		const timeReceived = createNewElement("span", "time-received");
		const infoIcon = createNewElement("span", "info-icon");

		// Inline check SVG fallback for robust rendering
		const checkSvgIcon = `<svg class="feather feather-check" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
		infoIcon.innerHTML = checkSvgIcon;

		statusGroup.appendChild(timeReceived);
		statusGroup.appendChild(infoIcon);

		// SFX Toggle Button positioned on the bottom right (even with robot avatar)
		const sfxBtn = createNewElement("button", "sfx-toggle-btn");
		sfxBtn.id = "sfx-toggle";
		sfxBtn.title = "Toggle Sound Effects (Key: M)";

		function updateSfxUI() {
			sfxBtn.innerHTML = soundEnabled ? SPEAKER_ON_SVG : SPEAKER_OFF_SVG;
			sfxBtn.setAttribute("aria-label", soundEnabled ? "Mute Sound Effects (Key: M)" : "Enable Sound Effects (Key: M)");
			sfxBtn.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
			sfxBtn.classList.toggle("is-muted", !soundEnabled);
		}
		updateSfxUI();

		sfxBtn.addEventListener("click", () => {
			soundEnabled = !soundEnabled;
			localStorage.setItem("jokes_sfx", soundEnabled ? "true" : "false");
			updateSfxUI();
			if (soundEnabled) playPopSFX();
		});

		messagesInfo.appendChild(statusGroup);
		messagesInfo.appendChild(sfxBtn);

		const dadJoke = createNewElement("p", "chat-message");
		const chatActions = createNewElement("div", "chat-bubble__actions");

		actions.forEach((item) => {
			const emoji = createNewElement("span", "emoji emoji--small");
			emoji.textContent = item.emoji;
			const emojiButton = createNewElement("button", "emoji-action");
			emojiButton.setAttribute("aria-label", item.label);
			emojiButton.appendChild(emoji);
			emojiButton.addEventListener("click", () => getJokes(false));
			chatActions.appendChild(emojiButton);
		});

		chatBubble.appendChild(chatActions);
		chatBubble.appendChild(dadJoke);
		chatContainer.appendChild(chatBubble);
		chatContainer.appendChild(messagesInfo);

		// Animation helper functions (Vanilla CSS)
		function triggerAvatarAnimation() {
			avatar.classList.remove("is-animating");
			void avatar.offsetWidth; // Force reflow
			avatar.classList.add("is-animating");
		}

		function getFallbackJoke() {
			let joke = FALLBACK_JOKES[Math.floor(Math.random() * FALLBACK_JOKES.length)];
			if (joke === lastJoke && FALLBACK_JOKES.length > 1) {
				joke = FALLBACK_JOKES[(FALLBACK_JOKES.indexOf(joke) + 1) % FALLBACK_JOKES.length];
			}
			lastJoke = joke;
			return joke;
		}

		function getJokes(isInitial = false) {
			if (isFetching) return;
			isFetching = true;

			if (!isInitial) {
				playClickSFX();
			}

			triggerAvatarAnimation();

			// Hide chat container and show typing dots
			if (chatContainer.parentNode) {
				chatContainer.remove();
			}
			chatContainer.classList.remove("is-entering");
			speaker.classList.add("is-visible");

			if (!isInitial) {
				playTypingSFX();
			}

			const controller = new AbortController();
			const timeoutId = setTimeout(() => controller.abort(), 5000);

			fetch(JOKES_API, {
				headers: { Accept: "application/json" },
				signal: controller.signal
			})
				.then((response) => {
					clearTimeout(timeoutId);
					if (response.ok) {
						return response.json();
					}
					throw new Error("Failed to fetch joke");
				})
				.then((data) => {
					const jokeText = data && data.joke ? data.joke : getFallbackJoke();
					displayJoke(jokeText, false, isInitial);
				})
				.catch((error) => {
					clearTimeout(timeoutId);
					displayJoke(getFallbackJoke(), true, isInitial);
				});
		}

		function displayJoke(jokeText, isOffline, isInitial = false) {
			setTimeout(() => {
				dadJoke.textContent = jokeText;

				const now = new Date();
				timeReceived.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

				if (isOffline) {
					const tag = document.createElement("span");
					tag.className = "offline-tag";
					tag.textContent = "Offline";
					timeReceived.appendChild(tag);
				}

				// Hide typing dots and show chat container
				speaker.classList.remove("is-visible");
				chatBot.appendChild(chatContainer);
				chatContainer.classList.add("is-entering");

				if (!isInitial) {
					playPopSFX();
				}

				isFetching = false;
			}, isInitial ? 350 : 800);
		}

		// Initial load (silent to respect browser autoplay policy)
		getJokes(true);

		// Keyboard Navigation Shortcuts
		document.addEventListener("keydown", (e) => {
			const activeEl = document.activeElement;
			const isInputActive = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.isContentEditable);

			if (isInputActive) return;

			if (e.code === "Space" || e.key.toLowerCase() === "n") {
				e.preventDefault();
				getJokes(false);
			} else if (e.key.toLowerCase() === "m") {
				e.preventDefault();
				sfxBtn.click();
			}
		});

		// Theme toggle functionality
		const themeToggleBtn = document.getElementById("theme-toggle");
		const themeToggleLightIcon = document.getElementById("theme-toggle-light-icon");
		const themeToggleDarkIcon = document.getElementById("theme-toggle-dark-icon");

		function updateIcons(theme) {
			if (theme === "dark") {
				themeToggleLightIcon.classList.remove("hidden");
				themeToggleDarkIcon.classList.add("hidden");
			} else {
				themeToggleLightIcon.classList.add("hidden");
				themeToggleDarkIcon.classList.remove("hidden");
			}
		}

		const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
		updateIcons(currentTheme);

		if (themeToggleBtn) {
			themeToggleBtn.addEventListener("click", () => {
				const activeTheme = document.documentElement.getAttribute("data-theme") || "light";
				const newTheme = activeTheme === "dark" ? "light" : "dark";
				document.documentElement.setAttribute("data-theme", newTheme);
				localStorage.setItem("theme", newTheme);
				updateIcons(newTheme);
			});
		}

		// Email link activator
		document.querySelectorAll('.js-email-link').forEach(link => {
			link.addEventListener('click', event => {
				event.preventDefault();
				const a = "Justin.richard.hill@";
				const b = "gmail.com";
				window.open(`mailto:${a}${b}`, 'email');
			});
		});
	</script>
</body>

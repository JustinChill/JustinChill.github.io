    // Inline script to prevent FOUC (Flash of Unstyled Content) by setting the correct theme immediately
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('js');
    })();
  </script>

  <script type="text/javascript">
    (function () {
      let cachedData = null;

      const annotations_vac = [
        { date: new Date(2020, 3, 29), text: "Biontech and Pfizer test corona vaccine" },
        { date: new Date(2020, 7, 20), text: "Russia approves the world's first vaccine" },
        { date: new Date(2020, 9, 20), text: "EU Medicines Agency reviews vaccine" },
        { date: new Date(2020, 10, 30), text: "EU approves Biontech/Pfizer vaccine" },
        { date: new Date(2021, 0, 19), text: "Astra-Zeneca approved for use in the EU" },
        { date: new Date(2021, 2, 10), text: "Vulnerable people vaccinated with priority" },
        { date: new Date(2021, 3, 15), text: "Astra-Zeneca vaccine has major side effects" },
        { date: new Date(2021, 7, 1), text: "Children and adolescents should be vaccinated" },
        { date: new Date(2021, 8, 1), text: "Second and third vaccinations (boosters) available" },
        { date: new Date(2022, 2, 16), text: "Compulsory vaccination for doctors and nurses" },
        { date: new Date(2023, 5, 1), text: "More than 13 billion vaccine doses administered" }
      ];

      const annotations_death = [
        { date: new Date(2019, 10, 15), text: "New lung disease in Wuhan, China" },
        { date: new Date(2020, 0, 20), text: "First patient dies of Covid-19 in Wuhan" },
        { date: new Date(2020, 2, 1), text: "WHO declares the outbreak a pandemic" },
        { date: new Date(2020, 3, 10), text: "Global stock market crash" },
        { date: new Date(2020, 3, 30), text: "Many countries impose social distancing" },
        { date: new Date(2020, 4, 30), text: "Hospitals overloaded" },
        { date: new Date(2020, 5, 30), text: "EU mobilizes billions to combat economic crisis" },
        { date: new Date(2020, 7, 10), text: "States require testing and quarantine" },
        { date: new Date(2020, 8, 29), text: "More than one million deaths worldwide" },
        { date: new Date(2020, 11, 5), text: "New mutation called Alpha in Great Britain" },
        { date: new Date(2021, 1, 1), text: "FFP2 masks prescribed more frequently" },
        { date: new Date(2021, 2, 10), text: "Self-tests start rolling out" },
        { date: new Date(2021, 3, 20), text: "States take on immense debts" },
        { date: new Date(2021, 6, 8), text: "Delta variant prevails" },
        { date: new Date(2021, 10, 26), text: "Worrying Omicron variant discovered" },
        { date: new Date(2022, 3, 2), text: "Mask requirements eased" },
        { date: new Date(2022, 10, 1), text: "The virus loses its terror" },
        { date: new Date(2023, 5, 1), text: "Seven million deaths" }
      ];

      function renderVisualizations() {
        if (!cachedData) return;

        const deathContainer = document.getElementById("death_chart");
        const vaxContainer = document.getElementById("vax_chart");
        if (!deathContainer || !vaxContainer) return;

        const deathWidth = deathContainer.getBoundingClientRect().width || 400;
        const vaxWidth = vaxContainer.getBoundingClientRect().width || 400;

        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        const ruleColor = isDark ? "rgba(255, 255, 255, 0.25)" : "#99AFC2";
        const monthTickColor = isDark ? "#94a3b8" : "#64748b";
        const yearTextColor = isDark ? "#f8fafc" : "#1e293b";
        const labelColor = isDark ? "#cbd5e1" : "#475569";
        const fontSize = 13;

        deathContainer.innerHTML = "";
        vaxContainer.innerHTML = "";

        const death_chart = {
          width: deathWidth,
          style: {
            fontSize: fontSize,
            background: "transparent",
            color: labelColor
          },
          height: 1500,
          marginLeft: 25,
          marginRight: 0,
          marginTop: 40,
          color: {
            legend: false
          },
          y: {
            axis: null,
            grid: true,
            ticks: [],
            reverse: true,
            domain: [new Date(2019, 10, 0), new Date(2023, 7, 0)]
          },
          x: {
            tickFormat: (d) => d.toLocaleString("en"),
            label: "Deaths per day",
            labelAnchor: "left",
            stroke: ruleColor,
            grid: false,
            axis: "top",
            ticks: [5000, 10000],
            domain: [0, 15000]
          },
          marks: [
            Plot.ruleX([0], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2019, 10, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2020, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2021, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2022, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2023, 0, 0)], {
              stroke: ruleColor
            }),

            // Annotations
            Plot.text(annotations_death, {
              x: 0,
              y: "date",
              text: "text",
              textAnchor: "start",
              lineAnchor: "top",
              fill: labelColor,
              dx: 4
            }),

            // Axis years
            Plot.axisY({
              ticks: "year",
              tickSize: 0,
              stroke: "none",
              fill: yearTextColor,
              fontWeight: "bold",
              dx: 12,
              dy: 10,
              textAnchor: "start"
            }),

            // Axis months
            Plot.axisY({
              ticks: "4 months",
              tickSize: 0,
              dx: 6,
              fill: monthTickColor,
              tickFormat: (d) => d.toLocaleString("en", {
                month: "short"
              }),
              textAnchor: "end"
            }),

            // Area / line
            Plot.areaX(
              cachedData.filter((d) => d.date < new Date(2023, 7, 0)), {
              y: "date",
              x: "death",
              fill: "#e84f1c",
              fillOpacity: 0.35,
              tip: true,
              curve: "catmull-rom"
            })
          ]
        };

        const vax_chart = {
          width: vaxWidth,
          style: {
            fontSize: fontSize,
            background: "transparent",
            color: labelColor
          },
          height: 1500,
          marginLeft: 0,
          marginRight: 25,
          marginTop: 40,
          color: {
            legend: false
          },
          y: {
            axis: null,
            grid: true,
            ticks: [],
            reverse: true,
            domain: [new Date(2019, 10, 0), new Date(2023, 7, 0)]
          },
          x: {
            tickFormat: (d) => d.toLocaleString("en"),
            label: "Vaccinations per day (M)",
            labelAnchor: "right",
            stroke: ruleColor,
            grid: false,
            axis: "top",
            reverse: true,
            ticks: [15, 30],
            domain: [0, 45]
          },
          marks: [
            Plot.ruleX([0], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2019, 10, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2020, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2021, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2022, 0, 0)], {
              stroke: ruleColor
            }),
            Plot.ruleY([new Date(2023, 0, 0)], {
              stroke: ruleColor
            }),

            // Annotations
            Plot.text(annotations_vac, {
              x: 0,
              y: "date",
              text: "text",
              textAnchor: "end",
              lineAnchor: "top",
              fill: labelColor,
              dx: -4
            }),

            // Axis years
            Plot.axisY({
              ticks: "year",
              tickSize: 0,
              anchor: "right",
              stroke: "none",
              fill: yearTextColor,
              fontWeight: "bold",
              dx: -12,
              dy: 10,
              textAnchor: "end"
            }),

            // Axis months
            Plot.axisY({
              ticks: "4 months",
              tickSize: 0,
              dx: -6,
              anchor: "right",
              fill: monthTickColor,
              tickFormat: (d) => d.toLocaleString("en", {
                month: "short"
              }),
              textAnchor: "start"
            }),

            // Area / line
            Plot.areaX(
              cachedData.filter((d) => d.date < new Date(2023, 7, 0)), {
              y: "date",
              x: (d) => d.vac,
              fill: "#4f80ff",
              fillOpacity: 0.35,
              tip: true,
              curve: "catmull-rom"
            })
          ]
        };

        deathContainer.appendChild(Plot.plot(death_chart));
        vaxContainer.appendChild(Plot.plot(vax_chart));
      }

      // Fetch data and initialize
      d3.csv("data/death_vac@9.csv", d3.autoType).then(function (rawData) {
        const death = rawData.map((d) => ({
          date: new Date(d.date),
          death: +d.death,
          vac: +d.vac
        }));
        cachedData = death.sort((a, b) => d3.ascending(a.date, b.date));
        renderVisualizations();
      });

      // Window resize handler with debounce
      let resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderVisualizations, 150);
      });

      // Expose re-render hook for theme switcher
      window.__renderCoronaCharts = renderVisualizations;
    })();
  </script>
  <script>
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeToggleLightIcon = document.getElementById("theme-toggle-light-icon");
    const themeToggleDarkIcon = document.getElementById("theme-toggle-dark-icon");

    function updateIcons(theme) {
      if (theme === "dark") {
        themeToggleLightIcon.classList.remove("hidden");
        themeToggleDarkIcon.classList.add("hidden");
      } else {
        themeToggleLightIcon.classList.add("hidden");
        themeToggleDarkIcon.classList.remove("hidden");
      }
    }

    const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
    updateIcons(currentTheme);

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const activeTheme = document.documentElement.getAttribute("data-theme") || "light";
        const newTheme = activeTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateIcons(newTheme);
        if (typeof window.__renderCoronaCharts === "function") {
          window.__renderCoronaCharts();
        }
      });
    }
  </script>

  <style type="text/css">
		main {
			font-family: "Open Sans", Helvetica, Arial, sans-serif;
		}

		.cont {
			position: relative;
			overflow: hidden;
			height: 100vh;
			height: 100dvh;
			padding: 0px 120px;
		}

		.cont__inner {
			position: relative;
			height: 100%;
		}

		.cont__inner:hover .el__bg:after {
			opacity: 1;
		}

		.el {
			position: absolute;
			left: 0;
			top: 0;
			width: 19.2%;
			height: 100%;
			/*background: #252525;*/
			transition: transform 0.6s 0.7s, width 0.7s, opacity 0.6s 0.7s, z-index 0s 1.3s;
			will-change: transform, width, opacity;
		}

		.el:not(.s--active) {
			cursor: pointer;
		}

		.el__overflow {
			overflow: hidden;
			position: relative;
			height: 100%;
		}

		.el__inner {
			overflow: hidden;
			position: relative;
			height: 100%;
			transition: transform 1s;
		}

		.cont.s--inactive .el__inner {
			transform: translate3d(0, 100%, 0);
		}

		.el__bg {
			position: relative;
			width: calc(100vw - 140px);
			height: 100%;
			transition: transform 0.6s 0.7s;
			will-change: transform;
		}

		.el__bg:before {
			content: "";
			position: absolute;
			left: 0;
			top: -5%;
			width: 100%;
			height: 110%;
			background-size: cover;
			background-position: center center;
			transition: transform 1s;
			transform: translate3d(0, 0, 0) scale(1);
		}

		.cont.s--inactive .el__bg:before {
			transform: translate3d(0, -100%, 0) scale(1.2);
		}

		.el.s--active .el__bg:before {
			transition: transform 0.8s;
		}

		.el__bg:after {
			content: "";
			z-index: 1;
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.15);
			opacity: 0;
			transition: opacity 0.5s;
		}

		.cont.s--el-active .el__bg:after {
			transition: opacity 0.5s 1.4s;
			opacity: 1 !important;
		}

		.el__preview-cont {
			z-index: 2;
			display: flex;
			justify-content: center;
			align-items: center;
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			transition: all 0.3s 1.2s;
		}

		.cont.s--inactive .el__preview-cont {
			opacity: 0;
			transform: translateY(10px);
		}

		.cont.s--el-active .el__preview-cont {
			opacity: 0;
			transform: translateY(30px);
			transition: all 0.5s;
		}

		.el__heading {
			color: #fff;
			text-transform: uppercase;
			font-size: 2.25rem;
			text-align: center;
		}

		h2.goodam {
			color: hsl(211, 39%, 23%);
		}

		.el__content {
			z-index: -1;
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			padding: 30px;
			opacity: 0;
			pointer-events: none;
			transition: all 0.1s;
		}

		.el.s--active .el__content {
			z-index: 2;
			opacity: 1;
			pointer-events: auto;
			transition: all 0.5s 1.4s;
		}

		.el__text {
			text-transform: uppercase;
			font-size: 40px;
			color: #fff;
		}

		.el__close-btn {
			z-index: -1;
			position: absolute;
			right: 10px;
			top: 10px;
			width: 60px;
			height: 60px;
			opacity: 0;
			pointer-events: none;
			transition: all 0s 0.45s;
			cursor: pointer;
		}

		.el.s--active .el__close-btn {
			z-index: 5;
			opacity: 1;
			pointer-events: auto;
			transition: all 0s 1.4s;
		}

		.el__close-btn:before,
		.el__close-btn:after {
			content: "";
			position: absolute;
			left: 0;
			top: 50%;
			width: 100%;
			height: 8px;
			margin-top: -4px;
			background: #fff;
			opacity: 0;
			transition: opacity 0s;
		}

		.el.s--active .el__close-btn:before,
		.el.s--active .el__close-btn:after {
			opacity: 1;
		}

		.el__close-btn:before {
			transform: rotate(45deg) translateX(100%);
		}

		.el.s--active .el__close-btn:before {
			transition: all 0.3s 1.4s cubic-bezier(0.72, 0.09, 0.32, 1.57);
			transform: rotate(45deg) translateX(0);
		}

		.el__close-btn:after {
			transform: rotate(-45deg) translateX(100%);
		}

		.el.s--active .el__close-btn:after {
			transition: all 0.3s 1.55s cubic-bezier(0.72, 0.09, 0.32, 1.57);
			transform: rotate(-45deg) translateX(0);
		}

		.el:focus-visible {
			outline: 3px solid #fff;
			outline-offset: -3px;
			z-index: 10;
		}

		.el__close-btn:focus-visible {
			outline: 2px solid #fff;
			outline-offset: 4px;
			border-radius: 4px;
		}

		@media (prefers-reduced-motion: reduce) {
			.el,
			.el__inner,
			.el__bg,
			.el__bg:before,
			.el__bg:after,
			.el__preview-cont,
			.el__content,
			.el__close-btn:before,
			.el__close-btn:after {
				transition: opacity 0.2s ease !important;
				transform: none !important;
			}
		}

		.el:nth-child(1) {
			transform: translate3d(0%, 0, 0);
			transform-origin: 50% 50%;
		}

		.cont.s--el-active .el:nth-child(1):not(.s--active) {
			transform: scale(0.5) translate3d(0%, 0, 0);
			opacity: 0;
			transition: transform 0.95s, opacity 0.95s;
		}

		.el:nth-child(1) .el__inner {
			transition-delay: 0s;
		}

		.el:nth-child(1) .el__bg {
			transform: translate3d(0%, 0, 0);
		}

		.el:nth-child(1) .el__bg:before {
			transition-delay: 0s;
			background-image: url("imgs/mac1.jpg");
		}

		.el:nth-child(2) {
			transform: translate3d(105.2083333333%, 0, 0);
			transform-origin: 155.2083333333% 50%;
		}

		.cont.s--el-active .el:nth-child(2):not(.s--active) {
			transform: scale(0.5) translate3d(105.2083333333%, 0, 0);
			opacity: 0;
			transition: transform 0.95s, opacity 0.95s;
		}

		.el:nth-child(2) .el__inner {
			transition-delay: 0.1s;
		}

		.el:nth-child(2) .el__bg {
			transform: translate3d(-19.2%, 0, 0);
		}

		.el:nth-child(2) .el__bg:before {
			transition-delay: 0.1s;
			background-image: url("imgs/mac2-min.jpg");
		}

		.el:nth-child(3) {
			transform: translate3d(210.4166666667%, 0, 0);
			transform-origin: 260.4166666667% 50%;
		}

		.cont.s--el-active .el:nth-child(3):not(.s--active) {
			transform: scale(0.5) translate3d(210.4166666667%, 0, 0);
			opacity: 0;
			transition: transform 0.95s, opacity 0.95s;
		}

		.el:nth-child(3) .el__inner {
			transition-delay: 0.2s;
		}

		.el:nth-child(3) .el__bg {
			transform: translate3d(-38.4%, 0, 0);
		}

		.el:nth-child(3) .el__bg:before {
			transition-delay: 0.2s;
			background-image: url("imgs/mac3-min.jpg");
		}

		.el:nth-child(4) {
			transform: translate3d(315.625%, 0, 0);
			transform-origin: 365.625% 50%;
		}

		.cont.s--el-active .el:nth-child(4):not(.s--active) {
			transform: scale(0.5) translate3d(315.625%, 0, 0);
			opacity: 0;
			transition: transform 0.95s, opacity 0.95s;
		}

		.el:nth-child(4) .el__inner {
			transition-delay: 0.3s;
		}

		.el:nth-child(4) .el__bg {
			transform: translate3d(-57.6%, 0, 0);
		}

		.el:nth-child(4) .el__bg:before {
			transition-delay: 0.3s;
			background-image: url("imgs/mac4.jpg");
		}

		.el:nth-child(5) {
			transform: translate3d(420.8333333333%, 0, 0);
			transform-origin: 470.8333333333% 50%;
		}

		.cont.s--el-active .el:nth-child(5):not(.s--active) {
			transform: scale(0.5) translate3d(420.8333333333%, 0, 0);
			opacity: 0;
			transition: transform 0.95s, opacity 0.95s;
		}

		.el:nth-child(5) .el__inner {
			transition-delay: 0.4s;
		}

		.el:nth-child(5) .el__bg {
			transform: translate3d(-76.8%, 0, 0);
		}

		.el:nth-child(5) .el__bg:before {
			transition-delay: 0.4s;
			background-image: url("imgs/mac5-min.png");
		}

		.el:hover .el__bg:after {
			opacity: 0;
		}

		.el.s--active {
			z-index: 1;
			width: 100%;
			transform: translate3d(0, 0, 0);
			transition: transform 0.6s, width 0.7s 0.7s, z-index 0s;
		}

		.el.s--active .el__bg {
			transform: translate3d(0, 0, 0);
			transition: transform 0.6s;
		}

		.el.s--active .el__bg:before {
			transition-delay: 0.6s;
			transform: scale(1);
		}

		nav.nav {
			z-index: 999;
		}

		@media (min-width: 1024px) {
			.nav,
			html[data-theme="dark"] .nav {
				background-color: transparent !important;
				background: transparent !important;
			}
		}

		@media (max-width: 900px) {
			.cont {
				padding: 1rem 1rem;
			}

			.el__heading {
				font-size: 1.2rem;
			}

			.el__bg {
				width: 100%;
			}

			.el:nth-child(3) .el__bg {
				transform: translate3d(0%, 0, 0);
			}

			.el:nth-child(4) .el__bg {
				transform: translate3d(0%, 0, 0);
			}

			.el:nth-child(5) .el__bg {
				transform: translate3d(0%, 0, 0);
			}
		}
	</style>

						src="imgs/github.svg" alt="GitHub logo" class="icon">Source code</a></span>

	<script type="text/javascript">
		const $cont = document.querySelector('.cont');
		const $elsArr = Array.from(document.querySelectorAll('.el'));
		const $closeBtnsArr = Array.from(document.querySelectorAll('.el__close-btn'));

		setTimeout(() => {
			$cont.classList.remove('s--inactive');
		}, 200);

		function openEl(el) {
			if (el.classList.contains('s--active')) return;
			$elsArr.forEach(item => {
				item.classList.remove('s--active');
				item.setAttribute('aria-expanded', 'false');
			});
			$cont.classList.add('s--el-active');
			el.classList.add('s--active');
			el.setAttribute('aria-expanded', 'true');
			const closeBtn = el.querySelector('.el__close-btn');
			if (closeBtn) closeBtn.focus();
		}

		function closeActiveEl(el) {
			$cont.classList.remove('s--el-active');
			if (el) {
				el.classList.remove('s--active');
				el.setAttribute('aria-expanded', 'false');
				el.focus();
			} else {
				$elsArr.forEach(item => {
					item.classList.remove('s--active');
					item.setAttribute('aria-expanded', 'false');
				});
			}
		}

		$elsArr.forEach($el => {
			$el.addEventListener('click', function () {
				openEl(this);
			});
			$el.addEventListener('keydown', function (e) {
				if ((e.key === 'Enter' || e.key === ' ') && !this.classList.contains('s--active')) {
					e.preventDefault();
					openEl(this);
				}
			});
		});

		$closeBtnsArr.forEach($btn => {
			const handleClose = (e) => {
				e.stopPropagation();
				const parentEl = $btn.closest('.el');
				closeActiveEl(parentEl);
			};

			$btn.addEventListener('click', handleClose);
			$btn.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' || e.key === ' ') {
					e.preventDefault();
					handleClose(e);
				}
			});
		});

		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape' && $cont.classList.contains('s--el-active')) {
				const activeEl = document.querySelector('.el.s--active');
				closeActiveEl(activeEl);
			}
		});

		// Email link handler
		document.querySelectorAll('.js-email-link').forEach(link => {
			link.addEventListener('click', (e) => {
				e.preventDefault();
				const a = "Justin.richard.hill@";
				const b = "gmail.com";
				window.open(`mailto:${a}${b}`, 'email');
			});
		});
	</script>
  <script>
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById("theme-toggle");
    const themeToggleLightIcon = document.getElementById("theme-toggle-light-icon");
    const themeToggleDarkIcon = document.getElementById("theme-toggle-dark-icon");

    function updateIcons(theme) {
      if (theme === "dark") {
        themeToggleLightIcon.classList.remove("hidden");
        themeToggleDarkIcon.classList.add("hidden");
      } else {
        themeToggleLightIcon.classList.add("hidden");
        themeToggleDarkIcon.classList.remove("hidden");
      }
    }

    const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
    updateIcons(currentTheme);

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener("click", () => {
        const activeTheme = document.documentElement.getAttribute("data-theme") || "light";
        const newTheme = activeTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateIcons(newTheme);
      });
    }
  </script>
</body>
